# Smart Surveillance System Configuration File

# Object Detection Settings
object_detection:
  model_path: "yolov8n.pt"
  detection_threshold: 0.5
  target_classes:
    - person

# Motion Detection Settings
motion_detection:
  sensitivity: "low"
  min_area: 500

# Display Settings
display:
  enabled: true
  window_name: "SafeVision"

# Snapshot Settings
snapshot:
  enabled: true
  directory: "snapshots"
  rate_limit: 1.0

# Logging Settings
logging:
  directory: "logs"
  max_size_mb: 10

# Alert Settings
alerts:
  classes:
    - person
  cooldown: 5.0

# Performance Settings
performance:
  target_fps: 10
  preprocessing_enabled: false
  resize_width: null